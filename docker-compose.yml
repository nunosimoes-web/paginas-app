# Páginas — stack completa: app + Postgres dedicado (BD isolada).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paginas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paginas}
      POSTGRES_DB: paginas
    volumes:
      - paginas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paginas"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://paginas:${POSTGRES_PASSWORD:-paginas}@db:5432/paginas
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paginas:${POSTGRES_PASSWORD:-paginas}@db:5432/paginas
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      DEFAULT_LOCALE: pt-PT
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  paginas-db:
